services:
  catchnet:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:24.14.1-bookworm-slim@sha256:b506e7321f176aae77317f99d67a24b272c1f09f1d10f1761f2773447d8da26c}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-https://registry.npmmirror.com/-/binary/playwright}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-http://mirrors.aliyun.com/debian}
        DEBIAN_SECURITY_MIRROR: ${DEBIAN_SECURITY_MIRROR:-http://mirrors.aliyun.com/debian-security}
    image: catchnet:local
    environment:
      NODE_ENV: production
      CATCHNET_HOST: 0.0.0.0
      CATCHNET_PORT: 3000
      CATCHNET_MAX_CONCURRENT_PROJECTS: ${CATCHNET_MAX_CONCURRENT_PROJECTS-2}
      CATCHNET_DATA_DIR: /data
      CATCHNET_ADMIN_PASSWORD: ${CATCHNET_ADMIN_PASSWORD:-}
      CATCHNET_MASTER_KEY: ${CATCHNET_MASTER_KEY:-}
      CATCHNET_ALLOWED_ORIGIN: ${CATCHNET_ALLOWED_ORIGIN:-}
      CATCHNET_TEST_DATA_CLEANUP_URL: ${CATCHNET_TEST_DATA_CLEANUP_URL:-}
      DOCKER_HOST: unix:///var/run/docker.sock
    ports:
      - '127.0.0.1:${CATCHNET_PORT:-3000}:3000'
    volumes:
      - catchnet-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - '${CATCHNET_DOCKER_GID:-0}'
    init: true
    shm_size: 1gb
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  catchnet-data:
